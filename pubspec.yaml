name: thapar_stepup
description: >
  Thapar StepUp — Campus fitness, social sports, and gamification app
  for students of Thapar Institute of Engineering & Technology (TIET), Patiala.
  Verified steps. Smart sport matching. Campus competition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.0

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.3

  health: ^11.0.0
  sensors_plus: ^5.0.1
  permission_handler: ^11.3.1

  uuid: ^4.4.2
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0
  logger: ^2.3.0
  flutter_local_notifications: ^17.2.2
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
