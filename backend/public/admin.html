<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StepUp | Admin / Instructor Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f3f7f0;--bg2:#e8f0e3;--card:#fff;--forest:#1e5c1e;--forest2:#2a7a2a;--sage:#4e8b4e;--text:#142814;--muted:#587058;--border:rgba(46,100,46,.16);--shadow:0 4px 18px rgba(30,92,30,.09);--sans:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:0 24px}.top{height:66px;border-bottom:1px solid var(--border);background:rgba(243,247,240,.92);display:flex;align-items:center}.topin{width:100%;max-width:1180px;padding:0 24px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:800;letter-spacing:-.04em}.brand em{font-style:normal;color:var(--forest)}.brand i{display:inline-block;width:7px;height:7px;border-radius:50% 0 50% 0;background:var(--forest);transform:rotate(45deg)}.user{font-size:12px;color:var(--muted);text-align:right}.user strong{color:var(--text);display:block}.page{padding:54px 0 72px}.eyebrow{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--forest)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.045em;margin:6px 0 8px}h2{font-size:20px;letter-spacing:-.025em}h3{font-size:15px}.lead{color:var(--muted);max-width:650px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px}.btn{border:1px solid transparent;border-radius:8px;padding:10px 15px;font-weight:700;font-size:12px}.btn.primary{background:var(--forest);color:#fff}.btn.primary:hover{background:var(--forest2)}.btn.secondary{border-color:var(--border);background:#fff;color:var(--text)}.btn.subtle{border-color:var(--border);background:transparent;color:var(--muted);padding:7px 10px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;background:#edf4e9;padding:13px 16px}.table td{padding:15px 16px;border-top:1px solid rgba(46,100,46,.1);vertical-align:top}.title{font-weight:700}.meta{font-size:12px;color:var(--muted)}.pill{font:600 10px var(--mono);padding:3px 7px;border-radius:12px;display:inline-block}.published{background:#e4f3e2;color:var(--forest);border:1px solid #bcdaba}.draft{background:#f5eee1;color:#7a5c1e;border:1px solid #e5d0aa}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:44px;text-align:center;color:var(--muted)}.notice{padding:10px 13px;margin:16px 0;border-radius:8px;font-size:13px;display:none}.notice.show{display:block}.notice.error{background:#fff0eb;color:#9a3617;border:1px solid #efc4b3}.notice.ok{background:#e7f4e5;color:var(--forest);border:1px solid #bedebc}.modal{display:none;position:fixed;inset:0;z-index:10;background:rgba(15,40,15,.38);padding:24px;overflow:auto}.modal.show{display:grid;place-items:center}.dialog{background:#fff;width:min(700px,100%);border-radius:16px;box-shadow:0 16px 50px rgba(15,45,15,.25);padding:25px}.dialoghead{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}.iconbtn{background:none;border:0;font-size:22px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;background:#fff;color:var(--text)}textarea{min-height:78px;resize:vertical}.drop{border:1.5px dashed #8fba8f;border-radius:10px;padding:22px;text-align:center;background:#f7fbf5;color:var(--muted)}.drop input{margin-top:10px;max-width:260px}.check{display:flex;align-items:center;gap:8px;font-size:13px}.check input{width:auto}.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.history-list{display:grid;gap:10px;max-height:65vh;overflow:auto}.version{border:1px solid var(--border);border-radius:10px;padding:15px}.versionhead{display:flex;justify-content:space-between;gap:12px}.files a{color:var(--forest);font-size:12px;font-weight:700;margin-right:12px}.login{max-width:440px;margin:8vh auto}.login .card{padding:29px}.login .brand{margin-bottom:25px}.login .btn{width:100%;margin-top:5px}.login .field{margin:13px 0}@media(max-width:650px){.shell{padding:0 16px}.topin{padding:0 16px}.hero{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.user{display:none}.page{padding-top:34px}}
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div class="modal" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
    <form class="dialog" id="uploadForm">
      <div class="dialoghead"><div><div class="eyebrow">Deliverable management</div><h2 id="uploadTitle">Upload a version</h2></div><button type="button" class="iconbtn" onclick="closeModal()" aria-label="Close">×</button></div>
      <div class="formgrid">
        <div class="field full"><label for="deliverableId">Existing deliverable</label><select id="deliverableId" name="deliverableId"><option value="">Create a new deliverable below</option></select></div>
        <div class="field full"><label for="deliverableName">New deliverable name</label><input id="deliverableName" name="deliverableName" maxlength="255" placeholder="Required only when creating a new deliverable"></div>
        <div class="field"><label for="versionNumber">Version number *</label><input id="versionNumber" name="versionNumber" required maxlength="50" placeholder="e.g. V3"></div>
        <div class="field"><label for="presentationDate">Presentation date *</label><input id="presentationDate" name="presentationDate" type="date" required></div>
        <div class="field full"><label for="authors">Authors *</label><input id="authors" name="authors" required placeholder="Separate names with commas"></div>
        <div class="field full"><label for="changeSummary">Change summary *</label><textarea id="changeSummary" name="changeSummary" required maxlength="3000" placeholder="What changed in this version?"></textarea></div>
        <div class="field full"><label for="file">Deliverable file *</label><div class="drop">PDF, Office document, presentation, spreadsheet, or ZIP · maximum 25 MB<br><input id="file" name="file" type="file" required accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.zip"><div class="meta" id="fileName"></div></div></div>
        <label class="check full"><input name="published" type="checkbox" checked> Publish this version now (unpublishes the prior current version)</label>
      </div>
      <div id="formNotice" class="notice"></div><div class="formfoot"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" id="submitUpload">Upload version</button></div>
    </form>
  </div>
  <div class="modal" id="historyModal" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><section class="dialog"><div class="dialoghead"><div><div class="eyebrow">All retained versions</div><h2 id="historyTitle">Version history</h2></div><button class="iconbtn" onclick="closeHistory()" aria-label="Close">×</button></div><div id="historyList" class="history-list"></div></section></div>
  <script>
    let currentUser, deliverables = [];
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const date = (value) => value ? new Intl.DateTimeFormat(undefined,{year:'numeric',month:'short',day:'numeric'}).format(new Date(value)) : '—';
    const api = async (url, options = {}) => { const response = await fetch(url, options); const body = response.headers.get('content-type')?.includes('application/json') ? await response.json() : {}; if (!response.ok) throw new Error(body.message || 'Request failed'); return body; };
    const notice = (id, message, type = 'error') => { const box = $(id); box.textContent = message; box.className = `notice show ${type}`; };
    function loginView() { $('app').innerHTML = `<div class="login"><section class="card"><div class="brand">Step<em>Up</em><i></i></div><div class="eyebrow">Authorized access</div><h1>Admin / Instructor</h1><p class="lead">Sign in with your existing StepUp instructor or administrator account.</p><form id="loginForm"><div class="field"><label>Email</label><input type="email" name="email" autocomplete="username" required></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><div id="loginNotice" class="notice"></div><button class="btn primary">Sign in securely</button></form></section></div>`; $('loginForm').addEventListener('submit', login); }
    async function login(event) { event.preventDefault(); const form = new FormData(event.currentTarget); try { await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))}); window.location.assign('/admin'); } catch(error) { notice('loginNotice',error.message); } }
    function dashboardView() { $('app').innerHTML = `<header class="top"><div class="topin"><div class="brand">Step<em>Up</em><i></i></div><div style="display:flex;align-items:center;gap:14px"><div class="user"><strong>${escapeHtml(currentUser.name)}</strong>${escapeHtml(currentUser.role)} · ${escapeHtml(currentUser.email)}</div><button class="btn subtle" onclick="logout()">Logout</button></div></div></header><div class="page"><div class="shell"><div class="hero"><div><div class="eyebrow">Administration</div><h1>Admin / Instructor Dashboard</h1><p class="lead">Upload, publish, and retain every version of your project deliverables.</p></div><button class="btn primary" onclick="openUpload()">+ Upload new version</button></div><div id="dashboardNotice" class="notice"></div><section class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Deliverable</th><th>Current version</th><th>Presentation date</th><th>Authors</th><th>Last updated</th><th>Status</th><th>Actions</th></tr></thead><tbody id="deliverableRows"></tbody></table></div></section></div></div>`; renderRows(); }
    function renderRows() { const rows = $('deliverableRows'); if (!deliverables.length) { rows.innerHTML = '<tr><td colspan="7" class="empty">No deliverables yet. Upload the first version to begin.</td></tr>'; return; } rows.innerHTML = deliverables.map(d => `<tr><td><div class="title">${escapeHtml(d.title)}</div><div class="meta">${d.version_count} version${d.version_count == 1 ? '' : 's'} retained</div></td><td>${d.version_number ? escapeHtml(d.version_number) : '—'}</td><td>${date(d.presentation_date)}</td><td class="meta">${(d.authors || []).map(escapeHtml).join(', ') || '—'}</td><td class="meta">${date(d.version_created_at || d.created_at)}</td><td>${d.version_id ? `<span class="pill ${d.published ? 'published' : 'draft'}">${d.published ? 'Published' : 'Draft'}</span>` : '—'}</td><td><div class="actions"><button class="btn subtle" onclick="showHistory(${d.id}, '${escapeHtml(d.title).replace(/'/g, '&#39;')}')">Version history</button><button class="btn subtle" onclick="openUpload(${d.id})">Upload new</button></div></td></tr>`).join(''); }
    async function loadDeliverables() { const data = await api('/api/admin/deliverables'); deliverables = data.deliverables; }
    async function boot() { try { const data = await api('/api/auth/me'); currentUser = data.user; if (location.pathname === '/admin/login') return window.location.replace('/admin'); await loadDeliverables(); dashboardView(); } catch { loginView(); } }
    function openUpload(id) { const select = $('deliverableId'); select.innerHTML = '<option value="">Create a new deliverable below</option>' + deliverables.map(d => `<option value="${d.id}">${escapeHtml(d.title)}</option>`).join(''); select.value = id || ''; $('uploadForm').reset(); select.value = id || ''; $('formNotice').className='notice'; $('uploadModal').classList.add('show'); }
    function closeModal() { $('uploadModal').classList.remove('show'); }
    $('file').addEventListener('change', e => $('fileName').textContent = e.target.files[0] ? e.target.files[0].name : '');
    $('uploadForm').addEventListener('submit', async event => { event.preventDefault(); const submit = $('submitUpload'); submit.disabled = true; submit.textContent = 'Uploading…'; try { const data = await api('/api/admin/deliverables/upload',{method:'POST',body:new FormData(event.currentTarget)}); closeModal(); await loadDeliverables(); renderRows(); notice('dashboardNotice',`${data.version.version_number} was saved${data.version.published ? ' and published' : ' as a draft'}.`,'ok'); } catch(error) { notice('formNotice',error.message); } finally { submit.disabled = false; submit.textContent = 'Upload version'; } });
    async function showHistory(id, title) { $('historyTitle').textContent = `${title} — version history`; $('historyList').innerHTML='<div class="empty">Loading version history…</div>'; $('historyModal').classList.add('show'); try { const data = await api(`/api/admin/deliverables/${id}/versions`); $('historyList').innerHTML = data.versions.length ? data.versions.map(v => `<article class="version"><div class="versionhead"><div><h3>${escapeHtml(v.version_number)}</h3><div class="meta">Created ${date(v.created_at)}${v.created_by_name ? ` by ${escapeHtml(v.created_by_name)}` : ''}</div></div><span class="pill ${v.published ? 'published' : 'draft'}">${v.published ? 'Published' : 'Previous version'}</span></div><p class="meta" style="margin:12px 0 5px"><strong>Presentation date:</strong> ${date(v.presentation_date)} · <strong>Authors:</strong> ${(v.authors || []).map(escapeHtml).join(', ')}</p><p>${escapeHtml(v.change_summary)}</p><div class="files">${(v.files || []).map(f => `<a href="${f.url}" target="_blank" rel="noopener">View ${escapeHtml(f.originalFilename)}</a><a href="${f.url}?download=1">Download</a>`).join('') || '<span class="meta">No attached file</span>'}</div>${v.published ? '' : `<div class="actions" style="margin-top:12px"><button class="btn subtle" onclick="publishVersion(${v.id}, ${id}, '${escapeHtml(title).replace(/'/g, '&#39;')}')">Publish this version</button></div>`}</article>`).join('') : '<div class="empty">No versions found.</div>'; } catch(error) { $('historyList').innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`; } }
    async function publishVersion(versionId, deliverableId, title) { try { await api(`/api/admin/versions/${versionId}/publish`,{method:'PATCH'}); await loadDeliverables(); renderRows(); await showHistory(deliverableId,title); notice('dashboardNotice','Published version updated.','ok'); } catch(error) { notice('dashboardNotice',error.message); } }
    function closeHistory() { $('historyModal').classList.remove('show'); }
    async function logout() { await api('/api/auth/logout',{method:'POST'}); currentUser = null; window.location.assign('/admin/login'); }
    boot();
  </script>
</body>
</html>
